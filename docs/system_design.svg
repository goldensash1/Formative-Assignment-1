<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Blockchain-Based Library Book Lending Tracker — System Design</text>

  <!-- Registries -->
  <rect x="40" y="70" width="220" height="110" rx="8" fill="#eef4ff" stroke="#3b5fc4" stroke-width="1.5"/>
  <text x="150" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2f6b">books.txt</text>
  <text x="150" y="115" text-anchor="middle" font-size="11" fill="#333">book_id, title, author</text>
  <text x="150" y="133" text-anchor="middle" font-size="11" fill="#333">loaded into Book[]</text>

  <rect x="40" y="200" width="220" height="110" rx="8" fill="#eef4ff" stroke="#3b5fc4" stroke-width="1.5"/>
  <text x="150" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2f6b">members.txt</text>
  <text x="150" y="245" text-anchor="middle" font-size="11" fill="#333">member_id, full_name,</text>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#333">course_code</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#333">loaded into Member[]</text>

  <!-- Registry module -->
  <rect x="310" y="140" width="210" height="100" rx="8" fill="#fff7e6" stroke="#c48a1a" stroke-width="1.5"/>
  <text x="415" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5100">Registry Module</text>
  <text x="415" y="185" text-anchor="middle" font-size="11" fill="#333">registry_find_book()</text>
  <text x="415" y="202" text-anchor="middle" font-size="11" fill="#333">registry_find_member()</text>
  <text x="415" y="219" text-anchor="middle" font-size="11" fill="#333">validates IDs before lending</text>

  <line x1="260" y1="125" x2="310" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="255" x2="310" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CLI -->
  <rect x="570" y="110" width="240" height="200" rx="8" fill="#eafaf0" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="690" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#155c34">CLI (main.c)</text>
  <text x="690" y="152" text-anchor="middle" font-size="11" fill="#333">1. Borrow   2. Return</text>
  <text x="690" y="169" text-anchor="middle" font-size="11" fill="#333">3. Mark Overdue   4. View</text>
  <text x="690" y="186" text-anchor="middle" font-size="11" fill="#333">5. Validate   8. List Books</text>
  <text x="690" y="203" text-anchor="middle" font-size="11" fill="#a33">6. Tamper demo [ADMIN]</text>
  <text x="690" y="220" text-anchor="middle" font-size="11" fill="#a33">7. Add user [ADMIN]</text>
  <text x="690" y="237" text-anchor="middle" font-size="11" fill="#333">9. List Members   10. Exit</text>
  <text x="690" y="266" text-anchor="middle" font-size="10" fill="#555">refuses new blocks while</text>
  <text x="690" y="280" text-anchor="middle" font-size="10" fill="#555">the chain is invalid</text>

  <line x1="520" y1="190" x2="570" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Auth module -->
  <rect x="870" y="55" width="290" height="125" rx="8" fill="#fff0f7" stroke="#b03a7a" stroke-width="1.5"/>
  <text x="1015" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b1f47">Auth Module (auth.c)</text>
  <text x="1015" y="98" text-anchor="middle" font-size="11" fill="#333">login: username + password (3 attempts)</text>
  <text x="1015" y="115" text-anchor="middle" font-size="11" fill="#333">users.dat: salt + PBKDF2-SHA256 hash (0600)</text>
  <text x="1015" y="132" text-anchor="middle" font-size="11" fill="#333">roles: LIBRARIAN / ADMIN</text>
  <text x="1015" y="152" text-anchor="middle" font-size="11" fill="#333">password unlocks the user's</text>
  <text x="1015" y="168" text-anchor="middle" font-size="11" fill="#333">encrypted private signing key</text>

  <line x1="870" y1="135" x2="810" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840" y="132" text-anchor="middle" font-size="10" fill="#555">Session</text>

  <!-- Crypto module -->
  <rect x="870" y="200" width="290" height="125" rx="8" fill="#fdeeee" stroke="#b23b3b" stroke-width="1.5"/>
  <text x="1015" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1f1f">Crypto Module (OpenSSL)</text>
  <text x="1015" y="243" text-anchor="middle" font-size="11" fill="#333">sha256_hex(data) -&gt; hash</text>
  <text x="1015" y="260" text-anchor="middle" font-size="11" fill="#333">sign: user's PRIVATE key (ECDSA P-256)</text>
  <text x="1015" y="277" text-anchor="middle" font-size="11" fill="#333">verify: signer's PUBLIC key</text>
  <text x="1015" y="294" text-anchor="middle" font-size="11" fill="#333">keys/&lt;user&gt;_private.pem (AES-256, 0600)</text>
  <text x="1015" y="311" text-anchor="middle" font-size="11" fill="#333">keys/&lt;user&gt;_public.pem</text>

  <line x1="1015" y1="180" x2="1015" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Blockchain module -->
  <rect x="310" y="330" width="500" height="90" rx="8" fill="#f3edff" stroke="#6a3bc4" stroke-width="1.5"/>
  <text x="560" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b1f7a">Blockchain Module (blockchain.c)</text>
  <text x="560" y="376" text-anchor="middle" font-size="11" fill="#333">chain_add_block()  chain_validate()  chain_find_active_loan()</text>
  <text x="560" y="393" text-anchor="middle" font-size="11" fill="#333">chain_save() (atomic temp + rename) / chain_load()  -&gt;  chain.dat</text>

  <line x1="690" y1="310" x2="620" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1015" y1="325" x2="810" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Chain of blocks -->
  <text x="600" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Hash-Linked Chain</text>

  <!-- Block 0 -->
  <g>
    <rect x="60" y="480" width="230" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="175" y="502" text-anchor="middle" font-size="13" font-weight="bold">Block #0 (Genesis)</text>
    <text x="75" y="522" font-size="10" fill="#333">index: 0</text>
    <text x="75" y="538" font-size="10" fill="#333">timestamp</text>
    <text x="75" y="554" font-size="10" fill="#333">book_id / book_title</text>
    <text x="75" y="570" font-size="10" fill="#333">member_id / member_name</text>
    <text x="75" y="586" font-size="10" fill="#333">action: GENESIS</text>
    <text x="75" y="602" font-size="10" fill="#333">recorded_by: admin</text>
    <text x="75" y="618" font-size="10" fill="#a33">previous_hash: 000...0 (64 zeros)</text>
    <text x="75" y="634" font-size="10" fill="#333">signature (ECDSA, ≤72B)</text>
    <text x="75" y="650" font-size="10" fill="#1f6b3b" font-weight="bold">hash: SHA256(all fields + sig)</text>
  </g>

  <!-- Block 1 -->
  <g>
    <rect x="340" y="480" width="230" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="455" y="502" text-anchor="middle" font-size="13" font-weight="bold">Block #1</text>
    <text x="355" y="522" font-size="10" fill="#333">index: 1</text>
    <text x="355" y="538" font-size="10" fill="#333">timestamp</text>
    <text x="355" y="554" font-size="10" fill="#333">book_id / book_title</text>
    <text x="355" y="570" font-size="10" fill="#333">member_id / member_name</text>
    <text x="355" y="586" font-size="10" fill="#333">action: BORROWED</text>
    <text x="355" y="602" font-size="10" fill="#333">recorded_by: librarian1</text>
    <text x="355" y="618" font-size="10" fill="#a33">previous_hash = Block#0.hash</text>
    <text x="355" y="634" font-size="10" fill="#333">signature (ECDSA, ≤72B)</text>
    <text x="355" y="650" font-size="10" fill="#1f6b3b" font-weight="bold">hash: SHA256(all fields + sig)</text>
  </g>

  <!-- Block 2 -->
  <g>
    <rect x="620" y="480" width="230" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="735" y="502" text-anchor="middle" font-size="13" font-weight="bold">Block #2</text>
    <text x="635" y="522" font-size="10" fill="#333">index: 2</text>
    <text x="635" y="538" font-size="10" fill="#333">timestamp</text>
    <text x="635" y="554" font-size="10" fill="#333">book_id / book_title</text>
    <text x="635" y="570" font-size="10" fill="#333">member_id / member_name</text>
    <text x="635" y="586" font-size="10" fill="#333">action: RETURNED</text>
    <text x="635" y="602" font-size="10" fill="#333">recorded_by: librarian1</text>
    <text x="635" y="618" font-size="10" fill="#a33">previous_hash = Block#1.hash</text>
    <text x="635" y="634" font-size="10" fill="#333">signature (ECDSA, ≤72B)</text>
    <text x="635" y="650" font-size="10" fill="#1f6b3b" font-weight="bold">hash: SHA256(all fields + sig)</text>
  </g>

  <!-- ellipsis block -->
  <g>
    <rect x="900" y="480" width="230" height="230" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="1015" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">Block #N ...</text>
    <text x="915" y="530" font-size="10" fill="#666">appended on every</text>
    <text x="915" y="546" font-size="10" fill="#666">Borrow / Return / Overdue action</text>
    <text x="915" y="570" font-size="10" fill="#a33">previous_hash = Block#(N-1).hash</text>
  </g>

  <line x1="290" y1="595" x2="340" y2="595" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="595" x2="620" y2="595" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="595" x2="900" y2="595" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="750" text-anchor="middle" font-size="11" fill="#555">Validation (at startup, before every append, and on demand): recompute each hash and compare to the stored hash;</text>
  <text x="600" y="768" text-anchor="middle" font-size="11" fill="#555">check previous_hash == prior block's hash (64 zeros for genesis); verify each signature with the recorded_by user's public key.</text>
  <text x="600" y="786" text-anchor="middle" font-size="11" fill="#555">Tampering with any field in an earlier block changes its recomputed hash, breaking the link to every block after it.</text>
</svg>
