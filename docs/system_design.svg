<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Blockchain-Based Library Book Lending Tracker — System Design</text>

  <!-- Registries -->
  <rect x="40" y="70" width="220" height="110" rx="8" fill="#eef4ff" stroke="#3b5fc4" stroke-width="1.5"/>
  <text x="150" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2f6b">books.txt</text>
  <text x="150" y="115" text-anchor="middle" font-size="11" fill="#333">book_id, title, author</text>
  <text x="150" y="133" text-anchor="middle" font-size="11" fill="#333">loaded into Book[]</text>

  <rect x="40" y="200" width="220" height="110" rx="8" fill="#eef4ff" stroke="#3b5fc4" stroke-width="1.5"/>
  <text x="150" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2f6b">members.txt</text>
  <text x="150" y="245" text-anchor="middle" font-size="11" fill="#333">member_id, full_name,</text>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#333">course_code</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#333">loaded into Member[]</text>

  <!-- Registry module -->
  <rect x="330" y="140" width="200" height="100" rx="8" fill="#fff7e6" stroke="#c48a1a" stroke-width="1.5"/>
  <text x="430" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5100">Registry Module</text>
  <text x="430" y="185" text-anchor="middle" font-size="11" fill="#333">registry_find_book()</text>
  <text x="430" y="202" text-anchor="middle" font-size="11" fill="#333">registry_find_member()</text>
  <text x="430" y="219" text-anchor="middle" font-size="11" fill="#333">validates IDs before lending</text>

  <line x1="260" y1="120" x2="330" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="255" x2="330" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CLI -->
  <rect x="580" y="140" width="220" height="100" rx="8" fill="#eafaf0" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="690" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#155c34">CLI (main.c)</text>
  <text x="690" y="185" text-anchor="middle" font-size="11" fill="#333">1. Borrow  2. Return</text>
  <text x="690" y="202" text-anchor="middle" font-size="11" fill="#333">3. View  4. Validate</text>
  <text x="690" y="219" text-anchor="middle" font-size="11" fill="#333">5. Tamper demo  6. Exit</text>

  <line x1="530" y1="190" x2="580" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Crypto module -->
  <rect x="870" y="140" width="270" height="120" rx="8" fill="#fdeeee" stroke="#b23b3b" stroke-width="1.5"/>
  <text x="1005" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1f1f">Crypto Module (OpenSSL)</text>
  <text x="1005" y="186" text-anchor="middle" font-size="11" fill="#333">sha256_hex(data) -&gt; hash</text>
  <text x="1005" y="203" text-anchor="middle" font-size="11" fill="#333">crypto_sign_hash() (ECDSA P-256)</text>
  <text x="1005" y="220" text-anchor="middle" font-size="11" fill="#333">crypto_verify_hash()</text>
  <text x="1005" y="237" text-anchor="middle" font-size="11" fill="#333">ec_private.pem / ec_public.pem</text>

  <line x1="800" y1="190" x2="870" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Blockchain module -->
  <rect x="330" y="300" width="470" height="90" rx="8" fill="#f3edff" stroke="#6a3bc4" stroke-width="1.5"/>
  <text x="565" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b1f7a">Blockchain Module (blockchain.c)</text>
  <text x="565" y="346" text-anchor="middle" font-size="11" fill="#333">chain_add_block()  chain_validate()  chain_find_active_loan()</text>
  <text x="565" y="363" text-anchor="middle" font-size="11" fill="#333">chain_save() / chain_load()  -&gt;  chain.dat</text>

  <line x1="690" y1="240" x2="600" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1005" y1="260" x2="700" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Chain of blocks -->
  <text x="600" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Hash-Linked Chain</text>

  <!-- Block 0 -->
  <g>
    <rect x="60" y="460" width="230" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="175" y="482" text-anchor="middle" font-size="13" font-weight="bold">Block #0 (Genesis)</text>
    <text x="75" y="502" font-size="10" fill="#333">index: 0</text>
    <text x="75" y="518" font-size="10" fill="#333">timestamp</text>
    <text x="75" y="534" font-size="10" fill="#333">book_id / book_title</text>
    <text x="75" y="550" font-size="10" fill="#333">member_id / member_name</text>
    <text x="75" y="566" font-size="10" fill="#333">action: GENESIS</text>
    <text x="75" y="582" font-size="10" fill="#a33">previous_hash: 000...0 (64 zeros)</text>
    <text x="75" y="598" font-size="10" fill="#333">signature (ECDSA, 72B)</text>
    <text x="75" y="614" font-size="10" fill="#1f6b3b" font-weight="bold">hash: SHA256(all fields)</text>
  </g>

  <!-- Block 1 -->
  <g>
    <rect x="340" y="460" width="230" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="455" y="482" text-anchor="middle" font-size="13" font-weight="bold">Block #1</text>
    <text x="355" y="502" font-size="10" fill="#333">index: 1</text>
    <text x="355" y="518" font-size="10" fill="#333">timestamp</text>
    <text x="355" y="534" font-size="10" fill="#333">book_id / book_title</text>
    <text x="355" y="550" font-size="10" fill="#333">member_id / member_name</text>
    <text x="355" y="566" font-size="10" fill="#333">action: BORROWED</text>
    <text x="355" y="582" font-size="10" fill="#a33">previous_hash = Block#0.hash</text>
    <text x="355" y="598" font-size="10" fill="#333">signature (ECDSA, 72B)</text>
    <text x="355" y="614" font-size="10" fill="#1f6b3b" font-weight="bold">hash: SHA256(all fields)</text>
  </g>

  <!-- Block 2 -->
  <g>
    <rect x="620" y="460" width="230" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="735" y="482" text-anchor="middle" font-size="13" font-weight="bold">Block #2</text>
    <text x="635" y="502" font-size="10" fill="#333">index: 2</text>
    <text x="635" y="518" font-size="10" fill="#333">timestamp</text>
    <text x="635" y="534" font-size="10" fill="#333">book_id / book_title</text>
    <text x="635" y="550" font-size="10" fill="#333">member_id / member_name</text>
    <text x="635" y="566" font-size="10" fill="#333">action: RETURNED</text>
    <text x="635" y="582" font-size="10" fill="#a33">previous_hash = Block#1.hash</text>
    <text x="635" y="598" font-size="10" fill="#333">signature (ECDSA, 72B)</text>
    <text x="635" y="614" font-size="10" fill="#1f6b3b" font-weight="bold">hash: SHA256(all fields)</text>
  </g>

  <!-- ellipsis block -->
  <g>
    <rect x="900" y="460" width="230" height="230" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="1015" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">Block #N ...</text>
    <text x="915" y="510" font-size="10" fill="#666">appended on every</text>
    <text x="915" y="526" font-size="10" fill="#666">Borrow / Return action</text>
    <text x="915" y="550" font-size="10" fill="#a33">previous_hash = Block#(N-1).hash</text>
  </g>

  <line x1="290" y1="575" x2="340" y2="575" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="575" x2="620" y2="575" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="575" x2="900" y2="575" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="730" text-anchor="middle" font-size="11" fill="#555">Validation: recompute each hash -&gt; compare to stored hash; check previous_hash == prior block's hash; re-verify each signature.</text>
  <text x="600" y="750" text-anchor="middle" font-size="11" fill="#555">Tampering with any field in an earlier block changes its recomputed hash, breaking the link to every block after it.</text>
</svg>
